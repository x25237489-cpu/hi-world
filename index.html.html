<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personal Page</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px 16px;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      padding: 40px 32px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.4), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .profile-tag {
      align-self: flex-start;
      background-color: rgba(56, 189, 248, 0.1);
      color: var(--accent);
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      padding: 6px 12px;
      border-radius: 9999px;
    }

    h1 {
      font-size: 2.25rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text-main);
      line-height: 1.1;
    }

    .role {
      font-size: 1.05rem;
      color: var(--accent);
      font-weight: 500;
    }

    .problem-statement {
      font-size: 0.975rem;
      line-height: 1.6;
      color: var(--text-muted);
    }

    .date-footer {
      margin-top: 8px;
      padding-top: 20px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 0.85rem;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .date-value {
      color: var(--text-main);
      font-weight: 500;
    }
  </style>
</head>
<body>

  <main class="card">
    <div class="profile-tag">Student Profile</div>
    <h1>Alex</h1>
    <p class="role">MSc student, National College of Ireland</p>
    <p class="problem-statement">
      I am focused on solving supply chain inefficiencies in small-to-medium enterprises through actionable data analytics and predictive modeling.
    </p>
    <footer class="date-footer">
      <span>Today's Date</span>
      <span class="date-value" id="current-date">Loading...</span>
    </footer>
  </main>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const dateElement = document.getElementById("current-date");
      const today = new Date();
      const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
      dateElement.textContent = today.toLocaleDateString('en-IE', options);
    });
  </script>

</body>
</html>
